# Audit Report Schema — VulnForge
$schema: http://json-schema.org/draft-07/schema#
$id: audit-report.schema.yaml
title: Audit Report
type: object
required:
  - report_version
  - target
  - summary
  - findings
properties:
  report_version:
    type: string
  target:
    type: object
    required: [project_name, project_root]
    properties:
      project_name:
        type: string
      project_root:
        type: string
      language:
        type: string
      framework:
        type: string
    additionalProperties: false
  summary:
    type: object
    required: [total_hypotheses, done_hypotheses, pending_hypotheses, confirmed_findings, refuted_hypotheses]
    properties:
      total_hypotheses:
        type: integer
        minimum: 0
      done_hypotheses:
        type: integer
        minimum: 0
      pending_hypotheses:
        type: integer
        minimum: 0
      confirmed_findings:
        type: integer
        minimum: 0
      risk_findings:
        type: integer
        minimum: 0
      refuted_hypotheses:
        type: integer
        minimum: 0
      overall_risk:
        type: string
        enum: [critical, high, medium, low, info]
    additionalProperties: false
  knowledge_summary:
    type: string
  findings:
    type: array
    items:
      type: object
      required: [id, title, severity, cvss_score, vulnerability_type, location]
      properties:
        id:
          type: string
          pattern: "^BUG-R\\d+(-[A-Z]\\d+)+-H\\d+$"
        hypothesis_id:
          type: string
          pattern: "^HYP-R\\d+(-[A-Z]\\d+)+-H\\d+$"
        title:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, none]
          description: NVD 等级，必须等于 cvss_score 的档位映射（critical 9.0-10.0 / high 7.0-8.9 / medium 4.0-6.9 / low 0.1-3.9 / none 0.0）
        cvss_score:
          type: number
          minimum: 0.0
          maximum: 10.0
          description: CVSS v3.1 基础分数
        vulnerability_type:
          type: string
        location:
          type: string
        remediation:
          type: string
      additionalProperties: false
  risks:
    type: array
    items:
      type: object
      required: [id, title, location]
      properties:
        id:
          type: string
          pattern: "^BUG-R\\d+(-[A-Z]\\d+)+-H\\d+$"
        hypothesis_id:
          type: string
          pattern: "^HYP-R\\d+(-[A-Z]\\d+)+-H\\d+$"
        title:
          type: string
        location:
          type: string
        note:
          type: string
      additionalProperties: false
  limitations:
    type: array
    items:
      type: string
    default: []
  notes:
    type: string
additionalProperties: false
