# Bug Report Schema — VulnForge
# 单条漏洞报告，作为 findings/<BUG-id>/report.yaml。四段式：metadata（索引 + 评分）/ description（概览 + 业务背景）/ code（触发步骤 + 复现配方 + 修复补丁）/ references。
$schema: http://json-schema.org/draft-07/schema#
$id: bug-report.schema.yaml
title: Bug Report

type: object
required:
  - metadata
  - description
  - code

properties:
  metadata:
    type: object
    required:
      - title
      - vuln_type
      - finding_class
      - cvss_vector
      - cvss_score
      - ev_vector
      - ev_score
      - ev_priority
      - poc_status
    properties:
      title:
        type: string
        description: 一句话标题——受影响功能(按业务职责称呼) + 漏洞类型 + 后果；各段一个惯用词，让没读过代码的人也认得
      vuln_type:
        type: string
        description: 漏洞类型简写（见 bug-report skill 枚举表）
      finding_class:
        type: string
        enum:
          - vulnerability
          - risk
        description: 结论分类。vulnerability=漏洞；risk=前提苛刻、影响有限或仅构成弱点的风险。
      cwe:
        type: string
        description: CWE 编号（如 CWE-190）
      cvss_vector:
        type: string
        description: CVSS v3.1 向量字符串
      cvss_score:
        type: number
        minimum: 0.0
        maximum: 10.0
        description: CVSS v3.1 基础分数
      ev_vector:
        type: string
        description: 利用价值向量（如 EV:1.0/R:N/E:D/C:D/I:X）
      ev_score:
        type: number
        minimum: 0
        maximum: 10
        description: 利用价值评分
      ev_priority:
        type: string
        enum: [P0, P1, P2, P3]
        description: 利用价值优先级（由 ev_score 映射，供评审速择）
      ev_rationale:
        type: string
        description: EV 各维度判断依据（逐维度说明）
      poc_status:
        type: string
        enum:
          - pending
          - reproduced
          - fail-reproduced
          - blocked
          - not-needed
        description: 动态复现状态。pending=待复现；reproduced=已复现；fail-reproduced=已具备条件但复现失败（终态）；blocked=执行环境或外部条件不足，暂无法复现；not-needed=风险类 finding 不做动态复现。
      exp_status:
        type: string
        enum:
          - pending
          - confirmed
          - downgraded
          - failed
          - blocked
          - not-needed
        description: EXP/真实影响评估状态。pending=待评估；confirmed=真实业务场景下危害成立；downgraded=PoC 成立但真实影响需降级；failed=真实场景下攻击不成立；blocked=EXP 条件无法模拟；not-needed=PoC 已等价真实影响。
      affected_versions:
        type: string
        description: 已确认或合理推断的受影响版本范围；未知时写 unknown
    additionalProperties: false

  description:
    type: object
    required:
      - summary
      - background
    properties:
      summary:
        type: string
        description: 漏洞概览,一段读懂:缺陷在哪(file:line)、怎样被触发(注入类为受控输入经某路径到达触发点,其他类为某顺序/状态/配置下成立)、造成什么后果、前提是否易满足;逐步展开交给 dataflow,不重复 metadata 标签
      background:
        type: string
        description: 给不熟悉该项目的读者做定位：说清项目是什么、出问题的模块负责什么、以及跟这个漏洞相关的输入或数据（按类型可能是外部输入、敏感数据或某个认证/配置前提）；停在缺陷本身之前，不写机制与严重性（归 dataflow/flaw、summary、评分）。
    additionalProperties: false

  code:
    type: object
    required:
      - dataflow
    properties:
      dataflow:
        type: array
        minItems: 1
        description: 一步步走到触发点的关键代码步骤（有污点流时即数据流）
        items:
          type: object
          required:
            - step
            - location
            - snippet
            - description
          properties:
            step:
              type: integer
              minimum: 1
            location:
              type: string
              description: file:line（关键代码锚点）
            function:
              type: string
              description: 所在函数/路由名（如适用）
            role:
              type: string
              enum:
                - source
                - propagation
                - sink
              description: 污点走向(污点类适用):source=污点源；propagation=传播；sink=危险点。时序/状态/配置等无清晰污点流的漏洞可留空
            snippet:
              type: string
              description: 该 location 处的真实代码原文（逐字复制，非转述）
            description:
              type: string
              description: 讲清这一步数据发生了什么——如何进入 / 怎样传播或被解析 / 在 sink 处被如何(不当)使用
            flaw:
              type: string
              description: 可选，点出根因那一步为何是缺陷——一句话说清此处为何不安全(有 sink 时通常即 sink 步)
          additionalProperties: false
      reproduction:
        type: object
        description: 可选整块——复现配方，让复现者能直接照做
        properties:
          medium:
            type: string
            description: 复现介质，如 http_request / cli / script
          preconditions:
            type: array
            description: 触发前必须先满足的条件
            items:
              type: string
          request:
            type: string
            description: 完整可复制的请求或命令（含必要的 header/cookie/body）
          payload_variants:
            type: array
            description: payload 变体列表
            items:
              type: string
          success_condition:
            type: string
            description: 明确的成功判据——观察到什么现象即证明触发成功
          notes:
            type: string
            description: 补充（平台差异、注意事项、仅在授权环境操作等）
        additionalProperties: false
      fix_patch:
        type: string
        pattern: "^(?:$|diff --git a/)"
        description: 修复点明确时填写以 diff --git a/ 开头的最小 unified diff；仅无法安全给出可落地补丁时为空
    additionalProperties: false

  references:
    type: array
    description: 参考资料链接（CWE / OWASP / 相关文档）
    items:
      type: string

additionalProperties: false
